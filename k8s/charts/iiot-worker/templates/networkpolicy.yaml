# The Kubernetes version of the Fargate security group: nothing may connect in except
# Prometheus from the monitoring namespace, and the pod may only call HTTPS (AWS APIs) + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iiot-worker
  labels:
    {{- include "iiot-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iiot-worker.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
