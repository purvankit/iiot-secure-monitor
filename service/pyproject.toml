[project]
name = "iiot-monitor"
version = "0.1.0"
description = "Ingest + detection service: SQS -> rules -> DynamoDB + SNS"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
# botocore[crt]: needed locally to load `aws login` credentials; Fargate uses the task role.
dev = ["pytest>=8", "ruff>=0.6", "botocore[crt]"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iiot_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
