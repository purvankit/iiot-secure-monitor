apiVersion: v1
kind: Service
metadata:
  name: iiot-worker
  labels:
    {{- include "iiot-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP   # in-cluster only; Prometheus scrapes it
  selector:
    {{- include "iiot-worker.selector" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
